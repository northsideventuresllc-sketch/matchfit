# NOTE (2026-09-03, Decision #1699 / lane D2): schedule: removed -- GitHub Actions schedules are
# forbidden. Moved to NI-Brain Supabase pg_cron (see scripts/sql/ni-brain/
# 20260903_pg_cron_matchfit_http_jobs.sql, job mf-tos-cron -- NOT under supabase/migrations,
# that path would apply it to the wrong Supabase project on merge). workflow_dispatch stays for
# manual runs only until the coordinator applies that SQL file against NI-Brain.
# Runs Match Fit scheduled jobs (waitlist promotion, TOS/session crons, abandoned-signup
# follow-up emails) every 15 minutes.
# Vercel Hobby cannot deploy vercel.json crons more often than once per day (see vercel.link/3Fpeeb1).
# On Vercel Pro you may merge vercel.cron.pro.example.json into vercel.json and disable this workflow.

name: Match Fit scheduled jobs

on:
  workflow_dispatch: {}

jobs:
  match-fit-tos-jobs:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke production cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.MATCH_FIT_APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_URL" ]; then
            echo "::error::Missing repository secrets CRON_SECRET and/or MATCH_FIT_APP_URL (e.g. https://match-fit.net). The cron job is NOT running."
            exit 1
          fi
          URL="${APP_URL%/}/api/cron/match-fit-tos-jobs"
          echo "GET $URL"
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "$URL"
