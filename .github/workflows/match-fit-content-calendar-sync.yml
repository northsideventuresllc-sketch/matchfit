# NOTE (2026-09-03, Decision #1699 / lane D2): schedule: removed -- GitHub Actions schedules are
# forbidden. Moved to NI-Brain Supabase pg_cron (see scripts/sql/ni-brain/
# 20260903_pg_cron_matchfit_http_jobs.sql, job mf-content-calendar-sync);
# workflow_dispatch stays for manual runs only in the meantime.
name: Match Fit content calendar sync

on:
  workflow_dispatch: {}

jobs:
  content-calendar-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Invoke content calendar sync cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.MATCH_FIT_APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_URL" ]; then
            echo "::error::Missing repository secrets CRON_SECRET and/or MATCH_FIT_APP_URL (e.g. https://match-fit.net). The cron job is NOT running."
            exit 1
          fi
          URL="${APP_URL%/}/api/cron/content-calendar-sync"
          echo "GET $URL"
          curl -fsS -X GET \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "$URL"
